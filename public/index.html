<style>
@font-face{font-family:Serif;src:url(fonts/YoungSerif-Regular.ttf);font-display:swap}

:root{--bg:#EAF5FA;--surf:#fff;--ink:#12343B;--mut:#5b7a82;--acc:#1F7A63;--sun:#FFC93C;--coral:#FF6F61;--line:#cfe3ea;--danger:#c0392b;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Body,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:var(--sat)}

.header-left{min-width:0;display:flex;flex-direction:column;gap:6px}
#library{width:max-content;max-width:135px;font:700 13px Body,system-ui,sans-serif!important}
h1{font:700 30px/1 Body,system-ui,sans-serif;margin:0;letter-spacing:.035em;text-transform:none}
h1::after{content:"";display:inline-block;width:.3em;height:.3em;border-radius:50%;background:var(--sun);margin-left:.07em}
#meta{display:block;color:var(--mut);font-size:13px;margin-top:4px}
.link{background:var(--surf);border:1px solid var(--line);color:var(--ink);font-weight:700;padding:8px 10px;border-radius:10px;box-shadow:0 1px 3px rgba(18,52,59,.08)}
.header-actions{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:112px}

#refreshBtn{width:38px;height:36px;align-self:flex-end;padding:6px;display:grid;place-items:center}
#refreshBtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#selb{white-space:nowrap}
.link.danger{color:var(--danger)}
.dot{width:9px;height:9px;border-radius:50%;background:#3fbf7f;display:inline-block;margin-left:5px}
#bar{padding:6px 18px 8px}
#q{width:100%;padding:12px 16px;border-radius:999px;border:0;background:var(--surf);color:var(--ink);font-size:16px;box-shadow:0 1px 6px rgba(18,52,59,.1)}
.chip{border:0;background:var(--surf);border-radius:999px;padding:6px 14px;font-size:14px;box-shadow:0 1px 4px rgba(18,52,59,.12)}
#crumb{margin-top:8px}#crumb .chip{background:var(--sun);color:#12343B;font-weight:700}
main{flex:1;overflow:auto;padding-bottom:170px}
.mh{font:400 23px Serif,Georgia,serif;padding:24px 18px 10px}

.tile{position:relative;aspect-ratio:1;border:5px solid #fffdf8;border-bottom-width:5px;padding:0;background:#fffdf8;border-radius:6px;overflow:hidden;box-shadow:0 2px 10px rgba(18,52,59,.16);transition:transform .15s}
.tile:hover{transform:rotate(-1.2deg) scale(1.02)}
.tile{content-visibility:auto;contain-intrinsic-size:116px 116px;contain:layout paint style}.tile img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}
.tile.sel{transform:scale(.9)}
#selectionMarquee{position:fixed;z-index:1800;border:1px solid var(--acc);background:rgba(31,122,99,.16);pointer-events:none;display:none;border-radius:3px}
.ph{display:grid;place-items:center;height:100%;color:var(--mut);font-size:22px;background:var(--line)}
.vb,.hb{position:absolute;bottom:6px;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.vb{right:7px}.hb{left:7px;color:var(--coral)}
.tick{position:absolute;left:7px;top:7px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);color:#fff;font-size:13px;line-height:20px;text-align:center}
.sel .tick{background:var(--sun);border-color:#fff;color:#12343B}

.art svg{width:170px;height:auto;margin-bottom:10px}

.onmap main,.onmap #bar{display:none}

.pin{position:relative;width:46px;height:54px;border:3px solid #fffdf8;border-bottom-width:11px;border-radius:4px;background:#fffdf8;box-shadow:0 3px 9px rgba(0,0,0,.35)}
.pin img{width:100%;height:100%;border-radius:1px;object-fit:cover;display:block}
.pin b{position:absolute;right:-11px;top:-11px;min-width:24px;height:24px;border-radius:12px;background:var(--coral);color:#fff;font-size:12px;line-height:24px;text-align:center;padding:0 6px;border:2px solid #fff}
#tabs,#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));display:flex;gap:2px;padding:6px;background:var(--surf);border-radius:30px;z-index:900;box-shadow:0 8px 28px rgba(18,52,59,.22)}
#tabs button{background:none;border:0;border-radius:24px;padding:7px 15px;display:grid;justify-items:center;gap:1px;font-size:11.5px;color:var(--mut)}
#tabs button[aria-current=true]{color:#12343B;background:var(--sun);font-weight:700}
#tabs svg,#fab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#uploadPanel .upfill{height:100%;width:0;background:var(--acc);border-radius:20px;transition:width .2s}
#uploadPanel .upfoot{font-size:12px;color:var(--mut);margin-top:8px}
#uploadPanel button{border:0;background:none;color:var(--acc);font-weight:700;padding:4px 0 4px 8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(172px + var(--sab));background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:14px;z-index:1600;max-width:90vw}
#lb{position:fixed;inset:0;background:#101319;z-index:2000;display:none;flex-direction:column;padding:var(--sat) 0 var(--sab);color:#fff}
#lb.open{display:flex}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;touch-action:pan-y;position:relative}
#stage img,#stage video{max-width:100%;max-height:100%;object-fit:contain}
#stage .lb-slide-in{will-change:transform,opacity;animation:lb-slide-in .24s cubic-bezier(.2,.75,.25,1) both}
#stage .lb-slide-in.from-right{--slide-from:100%}
#stage .lb-slide-in.from-left{--slide-from:-100%}
@keyframes lb-slide-in{from{transform:translateX(var(--slide-from));opacity:.55}to{transform:translateX(0);opacity:1}}
.lbar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;gap:6px}
.lbar button{background:rgba(255,255,255,.13);color:#fff;border:0;border-radius:999px;padding:9px 15px;font-size:15px}
.lbar .m{flex:1;text-align:center;font-size:13px;opacity:.7}
#dlg{position:fixed;inset:0;background:rgba(18,52,59,.5);z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}
#dlg.open{display:flex}
#card{background:var(--surf);border-radius:22px;padding:clamp(14px,2.5vw,22px);width:min( min(94vw,760px), 760px);max-height:calc(100dvh - 32px - var(--sat) - var(--sab));display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.24)}
#card h2{font:400 21px Serif,Georgia,serif;margin:0 0 12px;word-break:break-word;flex:0 0 auto}#card p{margin:4px 0;color:var(--mut);font-size:14px;overflow-wrap:anywhere}
.modal-body{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:3px;flex:1 1 auto}
#card>.acts{flex:0 0 auto;padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
#card input{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;margin:8px 0 2px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#conn{position:fixed;inset:0;overflow:auto;background:var(--bg);color:var(--ink);z-index:4000}
#conn img{width:100%;height:46vh;object-fit:cover;object-position:40% 80%;display:block}
#conn form{max-width:420px;margin:0 auto;padding:22px 22px calc(30px + var(--sab))}
#conn h1{font-size:46px}#conn p{color:var(--mut);margin:10px 0 16px}
#conn input{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-size:16px;margin-bottom:10px}
#go{width:100%;padding:14px;border:0;border-radius:999px;background:var(--sun);color:#12343B;font-weight:700;font-size:17px;box-shadow:0 4px 14px rgba(255,201,60,.5)}
#pf{width:100%;padding:13px;border:2px solid var(--ink);border-radius:999px;background:none;color:var(--ink);font-weight:700;font-size:16px}
#conn .or{text-align:center;color:var(--mut);margin:12px 0;font-size:14px}#conn #fn{font-size:13px;margin:8px 0 0}

@media (prefers-reduced-motion:reduce){.tile,#fab{transition:none}#stage .lb-slide-in{animation:none}}
.trash-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 16px;padding:11px 2px;border-bottom:1px solid var(--line)}.trash-row>div:first-child{min-width:0;overflow-wrap:anywhere}.trash-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.trash-actions button{font-size:13px;white-space:nowrap}.trash-actions .danger{color:var(--danger)}

</style>

  }else if(choice==="logout"){if(cfg.mode==="household")await fetch("/api/auth/logout",{method:"POST",credentials:"same-origin"});LS.removeItem("stash.cfg");location.reload()}

// ---- upload (EXIF location/date, thumbnails, then PUT to the drive)
async function exif(f){const o={};try{if(!window.exifr)return o;const g=await exifr.gps(f);if(g&&g.latitude!=null){o.lat=g.latitude;o.lng=g.longitude}const t=await exifr.parse(f,["DateTimeOriginal"]);if(t&&t.DateTimeOriginal)o.taken=+new Date(t.DateTimeOriginal)}catch(e){}return o}
async function thumb(f,video){let src,w,h,url,bitmap;
  try{
    if(video){url=URL.createObjectURL(f);const v=el("video");v.muted=true;v.playsInline=true;v.preload="metadata";v.src=url;
      await new Promise((a,b)=>{const timer=setTimeout(()=>b(new Error("Video thumbnail timed out")),8000);v.onloadedmetadata=()=>{clearTimeout(timer);a()};v.onerror=()=>{clearTimeout(timer);b(new Error("Video decode failed"))}});
      v.currentTime=Math.min(1,(v.duration||2)/2);await new Promise((a,b)=>{const timer=setTimeout(()=>a(),2500);v.onseeked=()=>{clearTimeout(timer);a()};v.onerror=()=>{clearTimeout(timer);b(new Error("Video seek failed"))}});src=v;w=v.videoWidth;h=v.videoHeight;
    }else{bitmap=await createImageBitmap(f,{imageOrientation:"from-image"});src=bitmap;w=src.width;h=src.height}
    if(!w||!h)throw new Error("Unsupported media dimensions");
    const side=Math.min(w,h),c=document.createElement("canvas");c.width=c.height=480;const ctx=c.getContext("2d");if(!ctx)throw new Error("Canvas unavailable");ctx.drawImage(src,(w-side)/2,(h-side)/2,side,side,0,0,480,480);
    return await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error("Thumbnail encoding failed")),"image/jpeg",.82));
  }finally{if(bitmap)bitmap.close();if(url)URL.revokeObjectURL(url)}
}
let uploadHidden=false;
function updateUploadProgress(state){
  const done=state.saved+state.failed+state.skipped,percent=state.finished?100:(state.totalBytes?Math.min(95,Math.round(state.sentBytes/state.totalBytes*95)):0);
  const mb=n=>(n/1048576).toFixed(1)+" MB";
  $("#uploadTitle").textContent=state.finished?(state.failed?"Upload finished with errors":"Upload complete"):`Uploading ${state.total} ${state.total===1?"item":"items"}`;
  $("#uploadDetail").textContent=state.finished?`${state.saved} saved${state.skipped?` · ${state.skipped} duplicates skipped`:""}${state.failed?` · ${state.failed} failed`:""}`:`${done} of ${state.total} files completed · ${mb(Math.min(state.sentBytes,state.totalBytes))} / ${mb(state.totalBytes)} sent`;
  $("#uploadFill").style.width=percent+"%";
  $("#uploadFoot").textContent=state.finished?"Your library has been updated.":`${state.active||"Preparing files…"} · Keep BlocStash open while uploads finish.`;
  $("#uploadPanel").hidden=uploadHidden;
}
$("#uploadHide").onclick=()=>{uploadHidden=true;$("#uploadPanel").hidden=true;toast("Uploads continue. Tap Add to view progress.",3500)};
$("#fab").onclick=()=>{if(uploadState&&!uploadState.finished&&uploadHidden){uploadHidden=false;$("#uploadPanel").hidden=false;return}$("#file").click()};
let uploadState=null;
function findDuplicateByFilename(file){
  // Same filename AND same size (older items without a stored size fall back to filename only).
  const key=file.name.trim().toLowerCase();
  return idx.items.find(item=>typeof item.name==="string"&&item.name.trim().toLowerCase()===key&&(typeof item.size!=="number"||item.size===file.size))||null;
}
$("#file").addEventListener("change",async e=>{
  const picker=e.currentTarget,fs=Array.from(picker.files||[]);picker.value="";if(!fs.length)return;
  const totalBytes=fs.reduce((n,f)=>n+f.size,0);let next=0;
  const wasIdle=!uploadState||uploadState.finished;
  uploadHidden=false;uploadState={total:fs.length,totalBytes,sentBytes:0,saved:0,failed:0,skipped:0,active:"Checking filenames…",finished:false};updateUploadProgress(uploadState);
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  // Refresh the index BEFORE comparing, so photos deleted on another device/tab are not treated as duplicates.
  // Skipped while an earlier upload is still running (its new items are not saved yet).
  if(wasIdle){try{uploadState.active="Refreshing your library…";updateUploadProgress(uploadState);await saveChain.catch(()=>{});await D.load();render()}catch(e){toast("Could not refresh library index for duplicate check",4000)}}
  const duplicates=[],seenSelected=new Map();
  // Yield to the event loop every 10 files so the browser can paint the progress bar.
  for(let i=0;i<fs.length;i++){
    const file=fs[i],key=file.name.trim().toLowerCase()+"|"+file.size;
    uploadState.active=`Checking filename ${i+1} of ${fs.length}: ${file.name}`;updateUploadProgress(uploadState);
    const prior=seenSelected.get(key)||findDuplicateByFilename(file);
    if(prior)duplicates.push({file,match:prior});else seenSelected.set(key,file);
    if((i+1)%10===0)await Promise.resolve();
  }
  // Yield after the loop so the "all checked" status is painted.
  await Promise.resolve();
  let duplicateMode="keep";
  if(duplicates.length){const body=[el("p","",`${duplicates.length} selected ${duplicates.length===1?"file is":"files are"} already in your library.`),el("p","",duplicates.slice(0,5).map(d=>d.file.name).join(", ")+(duplicates.length>5?` and ${duplicates.length-5} more`:"")),el("p","","Choose whether to skip these files or upload another copy. This choice applies to all duplicates in this batch.")];const choice=await modal("Duplicates found",body,[["Cancel upload","cancel"],["Skip duplicates","skip"],["Keep both","keep"]]);if(choice==="cancel"||choice===null){uploadState.finished=true;uploadState.active="Upload cancelled";updateUploadProgress(uploadState);return}duplicateMode=choice}
  const skipSet=new Set(duplicateMode==="skip"?duplicates.map(d=>d.file):[]);uploadState.skipped=skipSet.size;
  const queue=fs.filter(f=>!skipSet.has(f));if(!queue.length){uploadState.finished=true;uploadState.active="";updateUploadProgress(uploadState);toast(`${skipSet.size} duplicate${skipSet.size===1?"":"s"} skipped`);return}
  // Three concurrent workers keep mobile memory and network use bounded.
  const worker=async()=>{while(true){const i=next++;if(i>=queue.length)return;const f=queue[i];let originalName=null,thumbName=null,accounted=0;
    const kind=(f.type||"").startsWith("video")?"video":"image",id=(crypto.randomUUID?crypto.randomUUID().replace(/-/g,""):Date.now().toString(36)+Math.random().toString(36).slice(2,10)).toLowerCase(),ext=((f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5))||"bin";
    uploadState.active=f.name;updateUploadProgress(uploadState);
    try{
      const ex=kind==="image"?await exif(f):{};originalName=`o_${id}.${ext}`;thumbName=`t_${id}.jpg`;
      const taken=ex.taken||f.lastModified;
      await D.put(originalName,f,f.type||"application/octet-stream",loaded=>{const delta=Math.max(0,loaded-accounted);accounted=loaded;uploadState.sentBytes+=delta;updateUploadProgress(uploadState)},{original:f.name,taken});
      const tb=await thumb(f,kind==="video").catch(()=>null);if(tb)await D.put(thumbName,tb,"image/jpeg",null,{original:`.${thumbName}`,taken});
      idx.items.push({id,name:f.name,kind,ext,size:f.size,taken,lat:ex.lat,lng:ex.lng,th:!!tb,album,added:Date.now()});uploadState.saved++;
    }catch(err){uploadState.failed++;if(originalName)await D.del(originalName).catch(()=>{});if(thumbName)await D.del(thumbName).catch(()=>{});if(accounted<f.size){uploadState.sentBytes+=f.size-accounted;accounted=f.size}}
    updateUploadProgress(uploadState);
  }};
  await Promise.all(Array.from({length:Math.min(3,queue.length)},worker));
  try{await flushSave()}catch(err){uploadState.finished=true;uploadState.active="Library index save failed";updateUploadProgress(uploadState);toast("Media uploaded, but the library index could not be saved. Keep this page open and retry.",7000);render();return}
  uploadState.finished=true;uploadState.active="";updateUploadProgress(uploadState);render();
  toast(`${uploadState.saved} saved${uploadState.skipped?` · ${uploadState.skipped} duplicates skipped`:""}${uploadState.failed?` · ${uploadState.failed} failed`:""}`,4500);
  setTimeout(()=>{if(uploadState?.finished){$("#uploadPanel").hidden=true;uploadState=null;uploadHidden=false}},6500);
});

async function chooseHouseholdStorage(){
  if(cfg?.mode!=="household"||cfg.user?.role!=="admin"){toast("Only the household administrator can change storage.");return}
  const current=await fetch("/api/household/storage",{credentials:"same-origin",cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(new Error("Could not read storage settings"))).catch(e=>{toast(e.message);return null});
  if(!current)return;
  let chosenPath="";
  if(current.picker===false){
    chosenPath=(prompt(`Current folder: ${current.path}${current.available?"":"\n\nSTORAGE UNAVAILABLE"}\n\nEnter the full path of the new central folder on the server (for example /mnt/chromeos/removable/MyDrive/BlocStash). Existing media and trash will be copied before switching. The old folder is kept as a backup.`,"")||"").trim();
    if(!chosenPath)return;
  }else{
    const promptText=`Current folder: ${current.path}${current.available?"":"\n\nSTORAGE UNAVAILABLE"}\n\nThe Windows server will open a folder picker. Existing media and trash will be copied before switching. The old folder is kept as a backup.`;
    if(!confirm(promptText+"\n\nChoose a new central folder?"))return;
  }
  try{const r=await fetch("/api/household/storage/select",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:chosenPath})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||data.message||"Folder selection failed");if(data.cancelled){toast("Storage selection cancelled");return}toast("Central storage updated. All household devices now use this folder.",6000)}catch(e){toast(e.message||"Could not change central storage",7000)}
}
async function chooseFolder(){
  if(!cfg || cfg.mode!=="folder"){toast("Choose the household storage folder after signing in as administrator.");return}
  try{
    let h=await kv("get","dir").catch(()=>null);
    if(h){try{let permission=await h.queryPermission(RW);if(permission!=="granted")permission=await h.requestPermission(RW);if(permission!=="granted")h=null;if(h)await openFolder(h)}catch(e){h=null;root=null;files=null;await kv("put","dir",null).catch(()=>{})}}
    if(!h){h=await showDirectoryPicker({id:"stash",mode:"readwrite"});await openFolder(h)}
    await kv("put","dir",h);cfg={mode:"folder"};LS.setItem("stash.cfg",JSON.stringify(cfg));await boot();
  }catch(e){if(e.name!=="AbortError")toast("Could not open folder. Check browser permissions.")}
}
async function authScreen(){cfg=null;LS.removeItem("stash.cfg");$("#app").hidden=true;$("#conn").hidden=false;try{const r=await fetch('/api/auth/status',{cache:'no-store'});const state=await r.json();authSetup=state.setup;$("#authintro").textContent=authSetup?"Create the household administrator account. This account manages members and shared content, not private libraries.":"Sign in to your household BlocStash account.";const invite=new URLSearchParams(location.search).get('invite');if(invite){authSetup=false;$("#authintro").textContent="Join this BlocStash household. Choose your own username and password.";$("#go").textContent="Join household";$("#cf").dataset.invite=invite;}else{$("#cf").dataset.invite="";$("#go").textContent=authSetup?"Create household":"Sign in";}$("#password").autocomplete=authSetup?"new-password":"current-password";}catch(e){$("#err").textContent="Cannot reach the BlocStash server. Start it on your PC and open its local address."}}
$("#cf").onsubmit=async e=>{e.preventDefault();const body={username:$("#username").value.trim(),password:$("#password").value,rememberDays:$("#remember").checked?30:1};try{const r=await fetch($("#cf").dataset.invite?'/api/household/join':(authSetup?'/api/auth/setup':'/api/auth/login'),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify($("#cf").dataset.invite?{...body,code:$("#cf").dataset.invite}:body)});if(!r.ok){$("#err").textContent=await r.text();return}const data=await r.json();cfg={mode:'household',scope:'personal',user:data.user};LS.setItem('stash.cfg',JSON.stringify(cfg));$("#password").value='';await boot()}catch(x){$("#err").textContent="Could not connect to BlocStash. Check that the server is running."}};
$("#library").onchange=async()=>{if(cfg?.mode!=='household')return;cfg.scope=$("#library").value;LS.setItem('stash.cfg',JSON.stringify(cfg));album='';sel=null;await load();render()};
$("#refreshBtn").onclick=async()=>{const b=$("#refreshBtn");if(!cfg||b.disabled)return;b.disabled=true;try{await load();sel=null;render();toast("Library refreshed")}catch(e){toast("Could not refresh the library. Check your connection.",5000)}finally{b.disabled=false}};
function showConnection(message){
  root=null;files=null;
  $("#app").hidden=true;$("#conn").hidden=false;
  if(message)$("#err").textContent=message;

async function boot(){
  // Folder mode was a browser-local shortcut that could open the dashboard
  // without household authentication. It is no longer supported in Household Edition.
  if(cfg?.mode==="folder"){cfg=null;LS.removeItem("stash.cfg");await authScreen();return}
  if(!cfg || cfg.mode==="server"){await authScreen();return}
  if(cfg.mode==="household"){try{const me=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});if(!me.ok)throw 0;const d=await me.json();cfg.user=d.user;$("#library").hidden=false;$("#library").value=cfg.scope||"personal";}catch(e){await authScreen();return}}else $("#library").hidden=true;
  if(cfg&&cfg.mode==="folder"&&!root){
    const h=await kv("get","dir").catch(()=>null);
    try{
      if(!h)throw new Error("No saved folder handle");
      const permission=await h.queryPermission(RW);
      if(permission!=="granted")throw new Error("Folder permission needs to be renewed");
      await openFolder(h);
    }catch(e){
      // Do not keep retrying a stale handle or silently initialise a new library.
      await kv("put","dir",null).catch(()=>{});
      cfg=null;LS.removeItem("stash.cfg");
      showConnection("Your previous folder is unavailable. Select the original folder if it still exists, or choose another folder.");
      return;
    }
  }
  $("#conn").hidden=!!cfg;$("#app").hidden=!cfg;if(!cfg)return;
  try{await load()}catch(e){toast(cfg.mode==="folder"?"Can’t read this folder. Check that it still exists and is accessible.":"Can’t reach your drive")}render()
}
